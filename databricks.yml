# yaml-language-server: $schema=bundle_config_schema.json
# This is a Databricks asset bundle definition for flexbox_cg_gha_dab_notebook.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
# Useful Reference: https://docs.databricks.com/en/dev-tools/bundles/settings.html

# This specific file, databricks.yml should contain your "project level" details
# /resources can contain a file for each databricks workflow/job you create, starting with flexbox_cg_gha_dab_notebook_job.yml
# /resources/environments should contain environment specifics in targets to configure your bundle & jobs for each environment it may be deployed in

bundle:
  name: flexbox_cg_gha_dab_notebook
  engine: direct
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
sync:
  exclude:
    - .vscode
    - .devcontainer
    - .pre-commit-config.yaml
    - .github
    - .gitignore
    - .gitattributes
    - LICENSE
    - README.md
    - doc
    - scratch
  include:
    - flexbox_cg_gha_dab_notebook
    - requirements.txt

include:
  - resources/*.yml
targets:
  dev:
    mode: development
    default: true
  uat:
    mode: production
  prod:
    mode: production
