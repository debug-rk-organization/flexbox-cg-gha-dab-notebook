name: Reusable Validation and Build

# Provides reusable validation, linting, testing and deployment-target selection for the
# Declarative Automation Bundle. Called by the CI entry workflows and returns its outputs.
on:
  workflow_call:
    outputs:
      semver:
        description: Calculated semantic version
        value: ${{ jobs.version.outputs.semver }}
      pep440:
        description: PEP 440-compatible version for the Python package
        value: ${{ jobs.version.outputs.pep440 }}
      deployment_targets:
        description: JSON array of deployment environments selected for this branch
        value: ${{ jobs.build.outputs.deployment_targets }}

jobs:
  # Run repository quality checks independently from version calculation.
  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pre-commit hooks
        uses: procter-gamble/da-pp-pda-github-actions/composite/common/pre-commit@2edcb2ed8466782ad3b662b0e3d58c30a744236d # main

  # Full history is required for GitVersion to calculate a reliable version.
  version:
    name: Semantic Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.semver.outputs.semVer }}
      pep440: ${{ steps.pep440.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine version
        id: semver
        uses: procter-gamble/da-pp-pda-github-actions/composite/common/semver@2edcb2ed8466782ad3b662b0e3d58c30a744236d # main
      - name: Compute PEP 440 version
        id: pep440
        shell: pwsh
        env:
          SEMVER: ${{ steps.semver.outputs.semVer }}
        run: |
          # The GitVersion semver is used as-is; uv normalises it (0.1.0-beta.1 -> 0.1.0b1).
          # PullRequest and feature branch labels are not valid PEP 440, so those builds use
          # <major.minor.patch>-dev.<number>, the same rule as the Azure DevOps template.
          $version = $env:SEMVER
          $label = $env:GitVersion_PreReleaseLabel
          if ($label -and $label -notin @('alpha', 'beta', 'rc')) {
            $version = "$($env:GitVersion_MajorMinorPatch)-dev.$($env:GitVersion_PreReleaseNumber)"
          }
          Write-Host "Package version: $version (from $env:SEMVER)"
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # Resolve the target environment from the PR target branch (PRs) or the pushed branch.
  resolve-target:
    name: Resolve target environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - name: Resolve target
        id: resolve
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEV_ENABLED: ${{ vars.CICD_DEPLOY_DEV_ENABLED }}
          UAT_ENABLED: ${{ vars.CICD_DEPLOY_UAT_ENABLED }}
          PROD_ENABLED: ${{ vars.CICD_DEPLOY_PROD_ENABLED }}
        run: |
          $branch = if ($env:BASE_REF) { $env:BASE_REF } else { $env:REF_NAME }
          $target = switch -Wildcard ($branch) {
            "main"      { "prod" }
            "release/*" { "uat" }
            "hotfix/*"  { "uat" }
            default     { "dev" }
          }
          # Fall back to a configured environment when the branch's target is not enabled, so validation runs against a real workspace.
          $enabled = @{ dev = $env:DEV_ENABLED; uat = $env:UAT_ENABLED; prod = $env:PROD_ENABLED }
          if ($enabled[$target] -ne "true") {
            $fallbackOrder = switch ($target) {
              "prod"  { @("uat", "dev") }
              "uat"   { @("prod", "dev") }
              default { @("uat", "prod") }
            }
            foreach ($candidate in $fallbackOrder) {
              if ($enabled[$candidate] -eq "true") { $target = $candidate; break }
            }
          }
          Write-Host "Resolved target environment: $target (branch: $branch)"
          "name=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # All validation (pre-commit gate, linting, bundle validate) runs in a single job.
  validate:
    name: Validate
    needs: [pre-commit, version, resolve-target]
    if: ${{ !failure() && !cancelled() }}
    runs-on:
      labels: pg-pgi-4gb-1cpu
      group: devx-pgi
    environment:
      name: ${{ needs.resolve-target.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@903f2679e2ca728decb4a78c74d57570f8e8d2e5 # v1.12.1
      - name: Azure Login (OIDC)
        uses: procter-gamble/da-pp-pda-github-actions/composite/azure/azurelogin@2edcb2ed8466782ad3b662b0e3d58c30a744236d # main
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate bundle
        run: databricks bundle validate -t $TARGET
        env:
          TARGET: ${{ needs.resolve-target.outputs.name }}
          DATABRICKS_HOST: ${{ vars.WORKSPACE_URL }}

  # Build the wheel, run unit tests, analyze the code and select deployment targets.
  build:
    name: Build & Test
    needs: [version, validate, resolve-target]
    if: ${{ !failure() && !cancelled() }}
    runs-on:
      labels: pg-pgi-4gb-1cpu
      group: devx-pgi
    environment:
      name: ${{ needs.resolve-target.outputs.name }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: write
    outputs:
      deployment_targets: ${{ steps.targets.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@903f2679e2ca728decb4a78c74d57570f8e8d2e5 # v1.12.1
      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=flexbox_cg_gha_dab_notebook
            -Dsonar.projectVersion=${{ needs.version.outputs.semver }}

      # The branch picks the environment; the CICD_DEPLOY_*_ENABLED vars decide if it deploys.
      - name: Select deployment targets
        id: targets
        shell: pwsh
        env:
          DEV_ENABLED: ${{ vars.CICD_DEPLOY_DEV_ENABLED }}
          UAT_ENABLED: ${{ vars.CICD_DEPLOY_UAT_ENABLED }}
          PROD_ENABLED: ${{ vars.CICD_DEPLOY_PROD_ENABLED }}
          PROD_DR_ENABLED: ${{ vars.CICD_DEPLOY_PROD_DR_ENABLED }}
        run: |
          $targets = [System.Collections.Generic.List[string]]::new()

          switch -Wildcard ($env:GITHUB_REF) {
            "refs/heads/develop" {
              if ($env:DEV_ENABLED -eq "true") { $targets.Add("dev") }
            }
            "refs/heads/release/*" {
              if ($env:UAT_ENABLED -eq "true") { $targets.Add("uat") }
            }
            "refs/heads/hotfix/*" {
              if ($env:UAT_ENABLED -eq "true") { $targets.Add("uat") }
            }
            "refs/heads/main" {
              if ($env:PROD_ENABLED -eq "true") { $targets.Add("prod") }
              if ($env:PROD_DR_ENABLED -eq "true") { $targets.Add("prod_dr") }
            }
          }

          $value = ConvertTo-Json -InputObject $targets.ToArray() -Compress
          "value=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Selected deployment targets: $value"

      - name: Publish CI summary
        if: ${{ always() }}
        shell: pwsh
        env:
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          INITIATOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.semver }}
          TARGETS: ${{ steps.targets.outputs.value }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          $sonarLink = "n/a"
          if ($env:SONAR_HOST_URL -and $env:SONAR_PROJECT_KEY) {
            $sonarUrl = "$($env:SONAR_HOST_URL.TrimEnd('/'))/dashboard?id=$($env:SONAR_PROJECT_KEY)"
            $sonarLink = "[$($env:SONAR_PROJECT_KEY)]($sonarUrl)"
          }

          $lines = @(
            "## CI summary"
            ""
            "| Field | Value |"
            "| --- | --- |"
            "| Workflow | $env:WORKFLOW |"
            "| Event | $env:EVENT |"
            "| Initiator | $env:INITIATOR |"
            "| Branch | $env:REF_NAME |"
            "| Commit | $env:COMMIT |"
            "| Version | $env:VERSION |"
            "| Deployment targets | $env:TARGETS |"
            "| SonarQube project | $sonarLink |"
          )

          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
