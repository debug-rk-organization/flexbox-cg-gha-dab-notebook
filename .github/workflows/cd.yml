name: Continuous Delivery

# Runs CI once, then deploys the bundle to environments selected by the pushed branch.

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']

jobs:
  ci:
    name: Continuous Integration
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-tasks.yml
    # Reusable workflows receive no secrets unless they are passed explicitly.
    secrets: inherit

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: [ci]
    # A matrix over an empty array errors, so skip the job when no target is enabled.
    if: ${{ needs.ci.outputs.deployment_targets != '[]' }}
    strategy:
      # One environment failing must not cancel deployments to the others.
      fail-fast: false
      matrix:
        # CI returns the environments this branch is allowed to deploy to.
        environment: ${{ fromJSON(needs.ci.outputs.deployment_targets) }}
    # Self-hosted runner: the Databricks workspace is not reachable from hosted runners.
    runs-on:
      labels: pg-pgi-4gb-1cpu
      # DR deployments run on the DR runner group.
      group: ${{ matrix.environment == 'prod_dr' && 'devx-pgi-dr' || 'devx-pgi' }}
    # Binds the job to the GitHub Environment holding the approval gate and its vars.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      # Required to mint the OIDC tokens used for Azure and JFrog sign-in.
      id-token: write
      actions: read
      deployments: write
    steps:
      # The bundle is rebuilt from source here; DAB deploys a bundle, not a CI artifact.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@903f2679e2ca728decb4a78c74d57570f8e8d2e5 # v1.12.1
      - name: Azure Login (OIDC)
        uses: procter-gamble/da-pp-pda-github-actions/composite/azure/azurelogin@2edcb2ed8466782ad3b662b0e3d58c30a744236d # main
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Publishes bundle definitions to the workspace; it does not start the jobs.
      - name: Deploy application
        run: databricks bundle deploy -t ${{ matrix.environment }}
        env:
          DATABRICKS_HOST: ${{ vars.WORKSPACE_URL }}

      - name: Publish deployment summary
        if: ${{ always() }}
        shell: pwsh
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          WORKSPACE: ${{ vars.WORKSPACE_URL }}
          VERSION: ${{ needs.ci.outputs.semver }}
          INITIATOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $lines = @(
            "## Deployment summary"
            ""
            "| Field | Value |"
            "| --- | --- |"
            "| Environment | $env:ENVIRONMENT |"
            "| Workspace | $env:WORKSPACE |"
            "| Version | $env:VERSION |"
            "| Initiator | $env:INITIATOR |"
            "| Event | $env:EVENT |"
            "| Branch | $env:REF_NAME |"
            "| Commit | $env:COMMIT |"
            "| Status | $env:JOB_STATUS |"
          )
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
