# yaml-language-server: $schema=../bundle_config_schema.json
# The initial job for flexbox_cg_gha_dab_notebook

# Useful reference: https://docs.databricks.com/en/dev-tools/bundles/job-task-types.html

resources:
  jobs:
    flexbox_cg_gha_dab_notebook_job:
      name: "[flexbox_cg_gha_dab_notebook] - ETL"
      schedule:
        quartz_cron_expression: '0 0 0 ? * MON-FRI'
        timezone_id: Europe/Amsterdam
      tags:
        pipeline: flexbox_cg_gha_dab_notebook
        pause_status: "${var.job_status}"

      # email_notifications:
        # on_failure:
          # - your-ops-email@pg.com

      tasks:

        - task_key: run-notebook-task
          job_cluster_key: job_cluster

          # existing_cluster_id: "${var.instance_pool_id}"
          notebook_task:
            notebook_path: ${workspace.file_path}/${bundle.name}/notebooks/sample_notebook
            source: WORKSPACE
          # Ensure to use the latest stable version of libraries connected to the job
          libraries:
            - requirements: ../requirements.txt



      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            policy_id: ${var.cluster_policy_id}
            spark_version: 16.4.x-scala2.13
            # Looking for a different node type?
            # try
            # az vm list-sizes --location eastus2 --output table
            node_type_id: Standard_F4
            data_security_mode: SINGLE_USER
            spark_env_vars:
              PIP_EXTRA_INDEX_URL: "{{secrets/${var.secret_scope}/flexflow-platform-pip-extra-index-url}}"
              ENVIRONMENT: ${bundle.target}
            autoscale:
                min_workers: 1
                max_workers: 1
            custom_tags:
              #these tags are aligned with cloudfinops team and used for finops reporting powerbi
              #we recommend you add all that make sense, as well as any additional tags you want.
              pipeline: flexbox_cg_gha_dab_notebook #tag to replace ETL
              region: global #change to region if relevant
              medallionlevel: bronze_flexbox_cg_gha_dab_notebook #this should be gold/silver/bronze only
